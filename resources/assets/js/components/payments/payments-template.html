<div>
    <div class="row mb-1">
        <!-- Total Invoiced -->
        <div class="col-md-4 mb-2">
            <div class="card h-100 border-left-primary">
                <div class="card-body">
                    <div class="text-muted mb-2">
                        <i class="fa fa-file-text-o mr-1"></i>
                        Total Invoiced
                    </div>

                    <h3 class="mb-0 text-primary">
                        {{ totalInvoiced | toCurrency }}
                    </h3>
                </div>
            </div>
        </div>

        <!-- Total Paid -->
        <div class="col-md-4 mb-2">
            <div class="card h-100 border-left-success">
                <div class="card-body">
                    <div class="text-muted mb-2">
                        <i class="fa fa-check-circle-o mr-1"></i>
                        Total Paid
                    </div>

                    <h3 class="mb-0 text-success">
                        {{ totalPaid | toCurrency }}
                    </h3>
                </div>
            </div>
        </div>

        <!-- Balance -->
        <div class="col-md-4 mb-2">
            <div class="card h-100"
                 :class="{
                 'border-left-danger': totalBalance > 0,
                 'border-left-success': totalBalance < 0,
                 'border-left-secondary': totalBalance === 0
             }">

                <div class="card-body">
                    <div class="text-muted mb-2">
                        <i class="fa fa-balance-scale mr-1"></i>
                        {{ totalBalance < 0 ? 'Credit Balance' : 'Balance Due' }}
                    </div>

                    <h3 class="mb-0"
                        :class="{
                        'text-danger': totalBalance > 0,
                        'text-success': totalBalance < 0,
                        'text-muted': totalBalance === 0
                    }">

                        {{ Math.abs(totalBalance) | toCurrency }}
                    </h3>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="form-control" v-cloak>
            <div class="form-group pull-left">
                <div class="form-group">
                    <select id="single-select" v-model="per_page" class="form-control">
                        <option v-for="page in pages" :value="page">{{ page }}</option>
                    </select>
                </div>
            </div>
            <div class="form-group pull-right">
                <input type="text" class="form-control" v-model="filter" placeholder="Search" @keydown="$event.stopImmediatePropagation()">
            </div>
            <datatable class="table table-responsive-md table-hover" :columns="columns" :data="list" :filter="filter" :per-page="per_page">
                <template v-slot="{ columns, row }">
                    <tr>
                        <td>{{ row.v_id }}</td>
                        <td>{{ row.is_paid ? row.name : '--' }}</td>
                        <td>{{ row.total | toCurrency }}</td>
                        <td>{{ row.payment | toCurrency }}</td>
                        <td :class="{
                            'font-weight-bold text-danger': Number(row.balance_due) > 0,
                            'font-weight-bold text-success': Number(row.balance_due) < 0
                        }">
                            {{ row.balance_due | toCurrency }}
                        </td>
                        <td>
                            {{ row.due_date ? $options.filters.dateFormat($options.filters.dateParse(row.due_date, 'YYYY-MM-DD'), 'MM-DD-YYYY') : '--' }}
                        </td>
                        <td>{{ row.i_created_at | dateParse('YYYY-MM-DD') | dateFormat('MM-DD-YYYY') }}</td>
                        <td class="text-nowrap">
                            <a :href="`/payments/invoice/show/${row.v_id}`" class="btn btn-sm btn-outline-primary" role="button" title="view"><i class="fa fa-file-pdf-o"></i></a>
                            <a :href="`/payments/download/pdf/${row.v_id}`" class="btn btn-sm btn-outline-secondary" role="button" title="download invoice"><i class="fa fa-download"></i></a>
                        </td>
                    </tr>
                </template>
            </datatable>

            <total-entries :list="list"></total-entries>
            <div class="pull-right">
                <bootstrap-3-datatable-pager class="pagination" v-model="page" type="abbreviated" :per-page="per_page"></bootstrap-3-datatable-pager>
            </div>
        </div>
        <notifications position="bottom right"/>
    </div>
</div>
